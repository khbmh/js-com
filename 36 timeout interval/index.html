<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>setTimeout & setInterval</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background: #222;
      color: aliceblue;
      font-family: serif;
    }

    div {
      width: 200px;
      height: 200px;
      margin: 0 auto;
      margin-top: 10vh;
      display: flex;
      flex-direction: column;
    }

    #timer {
      font-size: 50px;
      margin: 0 auto;
      margin-top: 20px;

    }
    #btn{
      padding: 20px 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all .35s ease-in-out;
    }
    #btn:hover{
      background: #33333377;
    }
  </style>

</head>

<body>

  <div>
    <button id="btn">Timer</button>
    <span id="timer">3</span>
  </div>
  <script src="./36.js"></script>

</html>
